<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фамильное древо</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#2b2622;--muted:#7a6f66;--line:#cbbfb3;--m:#dfe8f5;--f:#f7e1e4;--accent:#8a5a2b}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a18;--card:#262320;--ink:#ece6df;--muted:#a59a8f;--line:#4a443e;--m:#26354a;--f:#4a2a31;--accent:#d9a46a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Georgia,"PT Serif",serif}
header{padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0;flex:1 1 auto}
.nav{display:flex;gap:6px}
button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:hover{border-color:var(--accent)}
input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:min(280px,100%)}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px;max-width:1400px;margin:auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.tree{overflow-x:auto;padding-bottom:8px}
.ped{display:flex;align-items:center}
.ped>.par{display:flex;flex-direction:column;justify-content:center;margin-left:22px;position:relative}
.ped>.par::before{content:"";position:absolute;left:-22px;top:50%;width:11px;border-top:1px solid var(--line)}
.ped>.par>.ped{position:relative;padding:4px 0}
.ped>.par>.ped::before{content:"";position:absolute;left:-11px;top:0;bottom:0;border-left:1px solid var(--line)}
.ped>.par>.ped:first-child::before{top:50%}
.ped>.par>.ped:last-child::before{bottom:50%}
.ped>.par>.ped>.box::before{content:"";position:absolute;left:-11px;top:50%;width:11px;border-top:1px solid var(--line)}
.box{position:relative;min-width:150px;max-width:190px;padding:6px 9px;border-radius:7px;background:var(--m);cursor:pointer;font-size:13px;border:1px solid transparent}
.box.f{background:var(--f)}
.box.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.box.empty{background:transparent;border:1px dashed var(--line);color:var(--muted);cursor:default}
.box b{display:block;font-weight:600}
.box small{color:var(--muted)}
.pedwrap{overflow:auto;cursor:grab;max-width:100%}
.pedwrap.drag{cursor:grabbing;user-select:none}
.zoomrow{display:flex;gap:8px;align-items:center;margin:22px 0 8px}
.zoomrow .sect{margin:0;flex:1}
.sect{margin:22px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.couple{display:flex;gap:6px;align-items:center}
.couple .amp{color:var(--muted)}
.kids{margin:8px 0 0 18px;padding-left:14px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
aside{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;align-self:start}
aside h2{margin:0 0 4px;font-size:19px}
aside h3{margin:14px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
aside ul{margin:0;padding-left:18px}
aside a{color:var(--accent);cursor:pointer;text-decoration:none}
aside figure{margin:8px 0 0}
aside figcaption{font-size:13px;color:var(--muted)}
aside img{max-width:100%;border-radius:6px;margin-top:6px}
.muted{color:var(--muted)}
footer{padding:16px;color:var(--muted);font-size:13px;text-align:center}
.pedwrap.big{height:calc(100vh - 140px)}
#mini{position:fixed;right:16px;bottom:16px;width:220px;height:160px;background:var(--card);opacity:.82;border:1px solid var(--line);border-radius:8px;overflow:hidden;z-index:10;display:none;cursor:pointer;touch-action:none}
#mini:hover{opacity:.95}
#mini .shot{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#mini .view{position:absolute;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);border-radius:3px}
</style>
</head>
<body>
<header>
  <nav class="nav">
    <button id="back">&larr;</button>
    <button id="fwd">&rarr;</button>
    <button id="home"></button>
  </nav>
  <h1 id="title">Фамильное древо</h1>
  <input id="q" list="names">
  <nav class="nav" id="langs"></nav>
  <datalist id="names"></datalist>
</header>
<main>
  <section class="tree" id="tree"></section>
  <aside id="card"></aside>
</main>
<div id="mini" aria-hidden="true"><div class="shot"></div><div class="view"></div></div>
<footer id="foot"></footer>
<script>
const GENS = 15;
const LANGS = {
  ru: {back:"Назад", fwd:"Вперёд", home:"Главная", find:"Найти человека…", unknown:"неизвестно", birth:"Рождение", death:"Смерть",
       parents:"Родители", spouses:"Супруги", children:"Дети", siblings:"Братья и сёстры", notes:"Заметки", sources:"Источники",
       photos:"Фото и документы", family:"Семья и потомки", ancestors:"Предки", bigger:"Крупнее", fit:"Уместить", married:"брак",
       foot:'Данные: <code>people.json</code>. Разверните своё древо — <a href="https://github.com/vkomlev/family-tree">исходники на GitHub</a>.'},
  it: {back:"Indietro", fwd:"Avanti", home:"Inizio", find:"Cerca una persona…", unknown:"sconosciuto", birth:"Nascita", death:"Morte",
       parents:"Genitori", spouses:"Coniugi", children:"Figli", siblings:"Fratelli e sorelle", notes:"Note", sources:"Fonti",
       photos:"Foto e documenti", family:"Famiglia e discendenti", ancestors:"Antenati", bigger:"Ingrandisci", fit:"Adatta", married:"matrimonio",
       foot:'Dati: <code>people.it.json</code>. Crea il tuo albero — <a href="https://github.com/vkomlev/family-tree">codice su GitHub</a>.'}
};
const LANG = (() => { const q = new URLSearchParams(location.search).get("lang"); return LANGS[q] ? q : "ru"; })();
const T = k => LANGS[LANG][k];
let P = {}, meta = {}, CAP = {};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const full = p => [p.surname, p.name, p.patronymic].filter(Boolean).join(" ") + (p.maiden ? ` (${p.maiden})` : "");
const fmt = d => !d ? "" : d.replace(/^(\d{4})-(\d\d)-(\d\d)$/, "$3.$2.$1");
const hide = p => p.living && meta.hideLiving !== false;
function years(p){
  if (hide(p)) return "";
  const b = fmt(p.birth?.date), d = fmt(p.death?.date);
  return b || d ? `${b || "?"}${d ? " – " + d : ""}` : "";
}
function box(id, cur){
  const p = P[id];
  if (!p) return `<div class="box empty">${T("unknown")}</div>`;
  return `<div class="box ${p.sex === "f" ? "f" : ""} ${cur ? "cur" : ""}" data-id="${id}"><b>${esc(p.surname)} ${esc(p.name)}</b>${esc(p.patronymic || "")}<br><small>${esc(years(p))}</small></div>`;
}
function ped(id, g){
  const p = P[id];
  let h = `<div class="ped">${box(id, g === 0)}`;
  if (p && g < GENS - 1 && (p.father || p.mother))
    h += `<div class="par">${ped(p.father, g + 1)}${ped(p.mother, g + 1)}</div>`;
  return h + "</div>";
}
const link = id => P[id] ? `<a data-id="${id}">${esc(full(P[id]))}</a>` : "";
const childrenOf = id => Object.values(P).filter(c => c.father === id || c.mother === id);
function spousesOf(p){
  const s = new Map((p.spouses || []).map(x => [x.id, x]));
  Object.values(P).forEach(o => (o.spouses || []).forEach(x => { if (x.id === p.id && !s.has(o.id)) s.set(o.id, {...x, id:o.id}); }));
  childrenOf(p.id).forEach(c => { const o = c.father === p.id ? c.mother : c.father; if (o && !s.has(o)) s.set(o, {id:o}); });
  return [...s.values()];
}
function card(id){
  const p = P[id];
  const ev = (label, e) => e && !hide(p) && (e.date || e.place) ? `<div><span class="muted">${label}:</span> ${esc(fmt(e.date))} ${esc(e.place || "")} ${e.cause ? "— " + esc(e.cause) : ""}</div>` : "";
  const sib = Object.values(P).filter(o => o.id !== id && ((p.father && o.father === p.father) || (p.mother && o.mother === p.mother)));
  const list = (t, arr) => arr.length ? `<h3>${t}</h3><ul>${arr.join("")}</ul>` : "";
  return `<h2>${esc(full(p))}</h2>
    ${ev(T("birth"), p.birth)}${ev(T("death"), p.death)}
    ${list(T("parents"), [p.father, p.mother].filter(x => P[x]).map(x => `<li>${link(x)}</li>`))}
    ${list(T("spouses"), spousesOf(p).map(s => `<li>${link(s.id)}${s.date ? `, ${T("married")} ${esc(fmt(s.date))} ${esc(s.place || "")}` : ""}</li>`))}
    ${list(T("children"), childrenOf(id).map(c => `<li>${link(c.id)}</li>`))}
    ${list(T("siblings"), sib.map(c => `<li>${link(c.id)}</li>`))}
    ${p.notes ? `<h3>${T("notes")}</h3><div>${esc(p.notes)}</div>` : ""}
    ${list(T("sources"), (p.sources || []).map(s => `<li>${esc(s)}</li>`))}
    ${(p.photos || []).length ? `<h3>${T("photos")}</h3>${p.photos.map(src => `<figure><a href="${esc(src)}" target="_blank"><img src="${esc(src)}" alt="${esc(CAP[src] || "")}" loading="lazy"></a>${CAP[src] ? `<figcaption>${esc(CAP[src])}</figcaption>` : ""}</figure>`).join("")}` : ""}`;
}
function desc(id, depth){
  const p = P[id];
  const sp = spousesOf(p).map(s => `<span class="amp">&amp;</span>${box(s.id)}`).join("");
  const kids = depth > 0 ? childrenOf(id) : [];
  return `<div><div class="couple">${box(id)}${sp}</div>${kids.length ? `<div class="kids">${kids.map(c => desc(c.id, depth - 1)).join("")}</div>` : ""}</div>`;
}
function family(id){
  const p = P[id];
  const sib = Object.values(P).filter(o => o.id !== id && ((p.father && o.father === p.father) || (p.mother && o.mother === p.mother)));
  let h = `<div class="sect" style="margin-top:0">${T("family")}</div>${desc(id, 3)}`;
  if (sib.length) h += `<div class="sect">${T("siblings")}</div><div class="kids" style="margin-left:0">${sib.map(s => desc(s.id, 2)).join("")}</div>`;
  return h;
}
function show(id){
  if (!P[id]) id = meta.root;
  document.getElementById("tree").innerHTML = `${family(id)}<div class="zoomrow"><div class="sect">${T("ancestors")}</div><button id="zoom">${T("bigger")}</button></div><div class="pedwrap" id="pedwrap"><div id="pedin">${ped(id, 0)}</div></div>`;
  document.getElementById("card").innerHTML = card(id);
  fit();
}
document.addEventListener("click", e => { const t = e.target.closest("[data-id]"); if (t) { go(t.dataset.id); scrollTo({top:0, behavior:"smooth"}); } });
document.getElementById("q").addEventListener("change", e => {
  const hit = Object.values(P).find(p => full(p) === e.target.value) || Object.values(P).find(p => full(p).toLowerCase().includes(e.target.value.toLowerCase()));
  if (hit) go(hit.id);
});
document.documentElement.lang = LANG;
for (const k of ["back", "fwd"]) { const b = document.getElementById(k); b.title = T(k); b.setAttribute("aria-label", T(k)); }
document.getElementById("home").innerHTML = "&#8962; " + T("home");
document.getElementById("q").placeholder = T("find");
document.getElementById("foot").innerHTML = T("foot");
document.getElementById("langs").innerHTML = Object.keys(LANGS).map(l => `<button data-lang="${l}"${l === LANG ? ' disabled' : ''}>${l.toUpperCase()}</button>`).join("");
document.getElementById("langs").addEventListener("click", e => { const l = e.target.dataset.lang; if (l) location.href = `?lang=${l}${location.hash}`; });
const load = f => fetch(f).then(r => r.ok ? r.json() : null).catch(() => null);
Promise.all([load("people.json"), LANG === "ru" ? null : load(`people.${LANG}.json`)]).then(([d, tr]) => {
  if (tr) {
    Object.assign(d.meta, tr.meta || {});
    d.captions = {...(d.captions || {}), ...(tr.captions || {})};
    d.people.forEach(p => Object.assign(p, (tr.people || {})[p.id] || {}));
  }
  meta = d.meta; CAP = d.captions || {}; d.people.forEach(p => P[p.id] = p);
  document.title = meta.title; document.getElementById("title").textContent = meta.title;
  document.getElementById("names").innerHTML = d.people.map(p => `<option value="${esc(full(p))}">`).join("");
  show(decodeURIComponent(location.hash.slice(1)) || meta.root);
});
let big = false;
function fit(){
  const w = document.getElementById("pedwrap"), i = document.getElementById("pedin"), b = document.getElementById("zoom");
  if (!w) return;
  i.style.zoom = 1;
  const k = Math.min(1, w.clientWidth / i.scrollWidth);
  const on = big && k < 1;
  i.style.zoom = big ? 1 : k;
  w.classList.toggle("big", on);
  b.style.display = k < 1 ? "" : "none";
  b.textContent = big ? T("fit") : T("bigger");
  mini(on);
}
const M = document.getElementById("mini");
let ms = 1;
function mini(on){
  M.style.display = on ? "block" : "none";
  if (!on) return;
  const w = document.getElementById("pedwrap"), i = document.getElementById("pedin");
  ms = Math.min(M.clientWidth / w.scrollWidth, M.clientHeight / w.scrollHeight);
  const shot = M.querySelector(".shot");
  shot.innerHTML = ""; shot.appendChild(i.cloneNode(true)).removeAttribute("id");
  shot.style.transform = `scale(${ms})`;
  mview();
}
function mview(){
  const w = document.getElementById("pedwrap"), v = M.querySelector(".view");
  if (!w || M.style.display === "none") return;
  Object.assign(v.style, {left: w.scrollLeft * ms + "px", top: w.scrollTop * ms + "px", width: w.clientWidth * ms + "px", height: w.clientHeight * ms + "px"});
}
function mjump(e){
  const w = document.getElementById("pedwrap"), r = M.getBoundingClientRect();
  w.scrollLeft = (e.clientX - r.left) / ms - w.clientWidth / 2;
  w.scrollTop = (e.clientY - r.top) / ms - w.clientHeight / 2;
}
let mdrag = false;
M.addEventListener("pointerdown", e => { mdrag = true; M.setPointerCapture(e.pointerId); mjump(e); });
M.addEventListener("pointermove", e => { if (mdrag) mjump(e); });
M.addEventListener("pointerup", () => { mdrag = false; });
document.addEventListener("scroll", e => { if (e.target.id === "pedwrap") mview(); }, true);
addEventListener("resize", fit);
document.addEventListener("click", e => { if (e.target.id === "zoom") { big = !big; fit(); } });
let dragging = null;
document.addEventListener("pointerdown", e => { const w = e.target.closest(".pedwrap"); if (w && !e.target.closest("[data-id]")) dragging = {w, x:e.clientX, y:e.clientY, l:w.scrollLeft, t:w.scrollTop, py:scrollY}; });
document.addEventListener("pointermove", e => { if (!dragging) return; dragging.w.classList.add("drag"); dragging.w.scrollLeft = dragging.l - (e.clientX - dragging.x); if (dragging.w.classList.contains("big")) dragging.w.scrollTop = dragging.t - (e.clientY - dragging.y); else scrollTo(0, dragging.py - (e.clientY - dragging.y)); });
document.addEventListener("pointerup", () => { if (dragging) dragging.w.classList.remove("drag"); dragging = null; });
function go(id){ if (decodeURIComponent(location.hash.slice(1)) === id) show(id); else location.hash = id; }
document.getElementById("back").onclick = () => history.back();
document.getElementById("fwd").onclick = () => history.forward();
document.getElementById("home").onclick = () => go(meta.root);
addEventListener("hashchange", () => show(decodeURIComponent(location.hash.slice(1))));
</script>
</body>
</html>
